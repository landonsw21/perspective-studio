<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Two-point perspective drafting tool: horizon, vanishing points, patterned rays, snapping boxes with perspective-correct face divisions, PNG export.">
<style>*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}</style>
<title>Two-Point Perspective Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap">
</head>
<body>
<style>
/* Layout: full-bleed drafting canvas on the left, a dense instrument panel on the right (stacks below on phones). */
:root {
  --chrome: #e6eaed;
  --panel: #f5f7f8;
  --ink: #1b252d;
  --muted: #5b6873;
  --rule: #d0d8de;
  --accent: #17607a;
  --accent-soft: #d6e8ef;
  --desk: #cfd6db;
  --paper: #ffffff;
  --danger: #b43c2f;
  --f-ui: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --chrome: #12181c; --panel: #172025; --ink: #dbe4ea; --muted: #8d9ca7; --rule: #2a363e;
    --accent: #5fb7d6; --accent-soft: #1d3540; --desk: #2a3339; --paper: #ffffff; --danger: #ef7b6c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --chrome: #12181c; --panel: #172025; --ink: #dbe4ea; --muted: #8d9ca7; --rule: #2a363e;
  --accent: #5fb7d6; --accent-soft: #1d3540; --desk: #2a3339; --paper: #ffffff; --danger: #ef7b6c;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--chrome); color: var(--ink); font-family: var(--f-ui); font-size: 13px; overflow: hidden; }
.app { display: grid; grid-template-columns: minmax(0, 1fr) 340px; height: 100%; }
.stage { position: relative; min-width: 0; overflow: hidden; background: var(--desk); }
#cv { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; outline: none; }
.toolbar {
  position: absolute; top: 12px; left: max(12px, env(safe-area-inset-left, 0px));
  display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100% - 24px);
}
.tb {
  font: 500 12px/1 var(--f-ui); letter-spacing: .02em; color: var(--ink);
  background: var(--panel); border: 1px solid var(--rule); border-radius: 6px;
  padding: 8px 10px; cursor: pointer; box-shadow: 0 1px 2px rgb(0 0 0 / .08);
}
.tb:hover { border-color: var(--accent); }
.tb:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.tb[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.tb.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.tb:disabled { opacity: .45; cursor: default; }
.status {
  position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 10px; right: 12px;
  display: flex; gap: 14px; flex-wrap: wrap; pointer-events: none;
  font: 400 11px/1.3 var(--f-data); color: var(--ink);
}
.status span { background: color-mix(in srgb, var(--panel) 88%, transparent); padding: 4px 7px; border-radius: 4px; }
.status .hint { font-family: var(--f-ui); font-size: 12px; }

.panel { background: var(--panel); border-left: 1px solid var(--rule); overflow-y: auto; min-width: 0; }
.ph {
  padding-block: 16px 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--rule);
}
.ph h1 { margin: 0; font: 600 17px/1.15 var(--f-ui); letter-spacing: .01em; text-wrap: balance; }
.ph p { margin: 4px 0 0; color: var(--muted); font-size: 12px; line-height: 1.4; }
details.sec { border-bottom: 1px solid var(--rule); }
details.sec > summary {
  list-style: none; cursor: pointer; user-select: none;
  padding-block: 11px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  font: 600 11px/1 var(--f-ui); text-transform: uppercase; letter-spacing: .1em; color: var(--muted);
  display: flex; justify-content: space-between; align-items: center;
}
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary::after { content: "+"; font: 400 15px/1 var(--f-data); }
details.sec[open] > summary::after { content: "–"; }
details.sec[open] > summary { color: var(--ink); }
.sb {
  display: grid; gap: 10px; padding-block: 2px 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 10px; }
.row > label, .row > .lab { color: var(--ink); min-width: 0; }
.row.range input[type=range] { grid-column: 1 / -1; width: 100%; margin: 0; accent-color: var(--accent); }
.num, .txt, select {
  font: 400 12px/1 var(--f-data); color: var(--ink); background: var(--chrome);
  border: 1px solid var(--rule); border-radius: 4px; padding: 5px 6px; font-variant-numeric: tabular-nums;
}
.num { width: 76px; text-align: right; }
.txt { width: 120px; letter-spacing: .12em; text-transform: uppercase; }
select { font-family: var(--f-ui); font-size: 12px; max-width: 180px; }
input[type=color] { width: 44px; height: 26px; padding: 0 2px; border: 1px solid var(--rule); border-radius: 4px; background: var(--chrome); cursor: pointer; }
input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }
.row.check { grid-template-columns: auto minmax(0, 1fr); }
.row.check label { cursor: pointer; }
.sub { font: 600 10.5px/1 var(--f-ui); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); padding-top: 6px; border-top: 1px dashed var(--rule); margin-top: 2px; }
.note { color: var(--muted); font-size: 11.5px; line-height: 1.45; }
.note code { font-family: var(--f-data); font-size: 11px; color: var(--ink); }
.seg { display: flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.seg button { flex: 1; font: 600 12px/1 var(--f-ui); letter-spacing: .04em; padding: 8px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); }
.btns { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { font: 500 12px/1 var(--f-ui); padding: 7px 10px; border-radius: 5px; border: 1px solid var(--rule); background: var(--chrome); color: var(--ink); cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.on { background: var(--accent-soft); border-color: var(--accent); }
.btn.warn { color: var(--danger); }
.btn.solid { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pair .row { grid-template-columns: auto minmax(0, 1fr); }
.pair .num { width: 100%; }
.swatch { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: 0; }
.patview { display: flex; gap: 2px; height: 14px; align-items: stretch; }
.patview i { flex: 1; max-width: 10px; border-radius: 1px; }

.modal { position: fixed; inset: 0; background: rgb(10 14 17 / .55); display: grid; place-items: center; padding: 16px; z-index: 10; }
.modal .card { background: var(--panel); color: var(--ink); border-radius: 10px; padding: 16px; max-width: min(720px, 100%); max-height: 90%; overflow: auto; display: grid; gap: 10px; }
.modal img { max-width: 100%; border: 1px solid var(--rule); background: repeating-conic-gradient(#ddd 0 25%, #fff 0 50%) 0 0 / 16px 16px; }
.modal textarea { width: 100%; min-height: 200px; font: 11px/1.4 var(--f-data); background: var(--chrome); color: var(--ink); border: 1px solid var(--rule); border-radius: 4px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 9px 14px; border-radius: 6px; font-size: 12.5px; z-index: 11; }

@media (max-width: 820px) {
  body { overflow: auto; }
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: 62vh auto; height: auto; }
  .panel { border-left: 0; border-top: 1px solid var(--rule); overflow: visible; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <main class="stage" id="stage">
    <canvas id="cv" tabindex="0" aria-label="Perspective drawing canvas"></canvas>
    <div class="toolbar" role="toolbar" aria-label="Canvas tools">
      <button class="tb primary" id="tbAdd" type="button">Add box</button>
      <button class="tb" id="tbSnap" type="button" aria-pressed="true">Snap</button>
      <button class="tb" id="tbFit" type="button">Fit view</button>
      <button class="tb" id="tbUndo" type="button" title="Undo (Ctrl/⌘ Z)">Undo</button>
      <button class="tb" id="tbRedo" type="button" title="Redo (Ctrl/⌘ Shift Z)">Redo</button>
      <button class="tb" id="tbExport" type="button">Export PNG</button>
    </div>
    <div class="status" aria-live="polite"><span id="stCoord">x 0 · y 0</span><span id="stZoom">100%</span><span class="hint" id="stHint">Drag empty space to pan · scroll or pinch to zoom</span></div>
  </main>
  <aside class="panel" id="panel">
    <div class="ph">
      <h1>Two-Point Perspective Studio</h1>
      <p>Set the eye level, place two vanishing points, fan rays from each, and build boxes that lock to the grid. The outlined rectangle is what gets exported.</p>
    </div>
    <div id="sections"></div>
  </aside>
</div>

<div class="modal" id="modal" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <strong id="mTitle"></strong>
    <div id="mBody"></div>
    <div class="btns"><button class="btn" id="mClose" type="button">Close</button></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script>
(() => {
"use strict";
/* ---------- vector helpers ---------- */
const deg = Math.PI / 180;
const add = (a, b) => ({ x: a.x + b.x, y: a.y + b.y });
const sub = (a, b) => ({ x: a.x - b.x, y: a.y - b.y });
const mul = (a, k) => ({ x: a.x * k, y: a.y * k });
const dot = (a, b) => a.x * b.x + a.y * b.y;
const cross = (a, b) => a.x * b.y - a.y * b.x;
const len = a => Math.hypot(a.x, a.y);
const norm = a => { const l = len(a) || 1; return { x: a.x / l, y: a.y / l }; };
const P = (x, y) => ({ x, y });
function isect(p, d, q, e) {
  const den = cross(d, e);
  if (Math.abs(den) < 1e-12) return null;
  const w = sub(q, p), t = cross(w, e) / den;
  return { x: p.x + d.x * t, y: p.y + d.y * t, t, u: cross(w, d) / den };
}
function inPoly(pt, poly) {
  let c = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const a = poly[i], b = poly[j];
    if ((a.y > pt.y) !== (b.y > pt.y) && pt.x < (b.x - a.x) * (pt.y - a.y) / (b.y - a.y) + a.x) c = !c;
  }
  return c;
}
function polyArea(p) { let s = 0; for (let i = 0; i < p.length; i++) { const a = p[i], b = p[(i + 1) % p.length]; s += a.x * b.y - b.x * a.y; } return s / 2; }
function segDist(p, a, b) { const ab = sub(b, a); const t = Math.max(0, Math.min(1, dot(sub(p, a), ab) / (dot(ab, ab) || 1))); return len(sub(p, add(a, mul(ab, t)))); }
const hex2rgb = h => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const shade = (rgb, k) => `rgb(${rgb.map(c => Math.round(Math.min(255, c * k))).join(",")})`;
const clone = o => JSON.parse(JSON.stringify(o));

/* ---------- state ---------- */
const st = (color, width, dash, opacity) => ({ color, width, dash, opacity });
const raysDefault = (ca, cb) => ({ show: true, mode: "spacing", count: 24, spacing: 40, spread: 140, rotate: 0, measure: 0, behind: false, pattern: "ABBB", from: "center", a: st(ca, 1, "solid", 0.9), b: st(cb, 0.6, "solid", 0.55) });
function defaultState() {
  return {
    horizon: { show: true, x: 0, y: -60, tilt: 0, color: "#1b252d", width: 1.5, dash: "solid", opacity: 1 },
    vps: [
      { dist: -1300, color: "#1d6fa5", size: 8, show: true, rays: raysDefault("#3d93c9", "#9ccbe6") },
      { dist: 1300, color: "#b8463a", size: 8, show: true, rays: raysDefault("#cc5a4c", "#e9aaa2") }
    ],
    linkRays: true, symmetric: false, lockFrame: false,
    verticals: { show: true, count: 16, spacing: 100, offset: 0, color: "#7d8b96", width: 0.6, dash: "solid", opacity: 0.4 },
    cone: { show: false, angle: 60, cv: 0, color: "#7d8b96" },
    snap: { on: true, radius: 14, points: true, lines: true, corners: true, dots: true },
    boxes: [], sel: -1,
    viewport: { show: true, x: -800, y: -450, w: 1600, h: 900, dim: true, clip: false, lockAspect: false },
    export: { scale: 1, bg: "white", rays: true, verticals: true, horizon: true, vps: false, boxes: true, cone: false }
  };
}
const divDefaults = () => ({ on: true, vp: 4, vert: 4, sides: true, caps: true, diag: "none", color: "#000000", width: 1, opacity: 0.85, hier: true });
const boxDefaults = () => ({ name: "Box", b0: P(0, 300), b2: P(0, 200), anchor: 0, h: 220, mode: "solid", ghost: 0.3, dashHidden: true, stroke: "#1f2a33", fill: "#dfe6eb", width: 2, faces: { top: true, bottom: true, s01: true, s12: true, s23: true, s30: true }, div: divDefaults() });

function deepMerge(base, over) {
  if (Array.isArray(base)) return Array.isArray(over) ? over : base;
  if (base && typeof base === "object") {
    const out = {};
    for (const k of Object.keys(base)) out[k] = (over && k in over) ? deepMerge(base[k], over[k]) : base[k];
    return out;
  }
  return (over === undefined || over === null || typeof over !== typeof base) ? base : over;
}
function normalize(s) {
  const d = defaultState();
  const out = deepMerge(d, s || {});
  out.vps = [0, 1].map(i => deepMerge(d.vps[i], (s && s.vps && s.vps[i]) || {}));
  out.boxes = (Array.isArray(out.boxes) ? out.boxes : []).map(b => deepMerge(boxDefaults(), b));
  if (out.sel >= out.boxes.length) out.sel = out.boxes.length - 1;
  return out;
}

const STORE_KEY = "tpp-studio-v1";
let state;
try { const raw = localStorage.getItem(STORE_KEY); state = raw ? normalize(JSON.parse(raw)) : null; } catch (e) { state = null; }
const freshStart = !state;
if (!state) state = defaultState();

const ui = { vp: 0, resetArm: false };
const view = { x: 0, y: 0, z: 1 };

/* ---------- geometry ---------- */
function geo() {
  const h = state.horizon, a = h.tilt * deg;
  const u = P(Math.cos(a), Math.sin(a)), n = P(-u.y, u.x);
  const O = P(h.x, h.y);
  return { O, u, n, vp: state.vps.map(v => add(O, mul(u, v.dist))) };
}
function rayList(vi, g) {
  const R = state.vps[vi].rays, V = g.vp[vi], out = [];
  const pat = R.pattern || "A";
  if (R.mode === "spacing") {
    const M = add(g.O, mul(g.u, R.measure)), c = Math.max(0, Math.round(R.count));
    for (let k = -c; k <= c; k++) {
      const d = sub(add(M, mul(g.n, k * R.spacing)), V);
      if (len(d) < 1e-6) continue;
      const idx = R.from === "edge" ? k + c : Math.abs(k);
      out.push({ d: norm(d), ch: pat[idx % pat.length] });
    }
  } else {
    const toward = sub(g.O, V);
    const base = len(toward) > 1e-6 ? norm(toward) : (vi === 0 ? g.u : mul(g.u, -1));
    const c = Math.max(1, Math.round(R.count));
    for (let i = 0; i < c; i++) {
      const a = ((c === 1 ? 0 : -R.spread / 2 + R.spread * i / (c - 1)) + R.rotate) * deg;
      const cs = Math.cos(a), sn = Math.sin(a);
      const idx = R.from === "edge" ? i : Math.floor(Math.abs(i - (c - 1) / 2));
      out.push({ d: P(base.x * cs - base.y * sn, base.x * sn + base.y * cs), ch: pat[idx % pat.length] });
    }
  }
  return out;
}
// Box faces: corners 0..3 on a face; edges 0-1 & 2-3 run to VP1, 1-2 & 3-0 run to VP2.
const edgeVP = (i, j) => ((i + j) === 3 ? 1 : 0);
function meet(p, vpA, q, vpB) { return isect(p, sub(vpA, p), q, sub(vpB, q)); }
function bottomFromDiag(i, Pi, Po, g) {
  // returns [b0,b2] given corner i at Pi and its opposite corner at Po
  if (i % 2 === 0) return i === 0 ? [Pi, Po] : [Po, Pi];
  const P1 = i === 1 ? Pi : Po, P3 = i === 1 ? Po : Pi;
  const b0 = meet(P1, g.vp[0], P3, g.vp[1]), b2 = meet(P1, g.vp[1], P3, g.vp[0]);
  if (!b0 || !b2) return null;
  return [P(b0.x, b0.y), P(b2.x, b2.y)];
}
function bottomQuad(bx, g) {
  const b0 = bx.b0, b2 = bx.b2;
  const mid = mul(add(b0, b2), 0.5);
  const b1 = meet(b0, g.vp[0], b2, g.vp[1]) || mid;
  const b3 = meet(b0, g.vp[1], b2, g.vp[0]) || mid;
  return [b0, P(b1.x, b1.y), b2, P(b3.x, b3.y)];
}
function topQuad(B, bx, g) {
  const a = bx.anchor, T = [];
  const vert = (from, vpIdx, j) => {
    const r = isect(from, sub(g.vp[vpIdx], from), B[j], g.n);
    return r && len(sub(r, B[j])) < 1e6 ? P(r.x, r.y) : add(B[j], mul(g.n, -bx.h));
  };
  T[a] = add(B[a], mul(g.n, -bx.h));
  const j1 = (a + 1) % 4, j3 = (a + 3) % 4, o = (a + 2) % 4;
  T[j1] = vert(T[a], edgeVP(a, j1), j1);
  T[j3] = vert(T[a], edgeVP(a, j3), j3);
  T[o] = vert(T[j1], edgeVP(j1, o), o);
  return T;
}
const FACES = [
  { id: "bottom", v: ["b0", "b3", "b2", "b1"], shade: 0.62 },
  { id: "top", v: ["t0", "t1", "t2", "t3"], shade: 1 },
  { id: "s01", v: ["b0", "b1", "t1", "t0"], shade: 0.88 },
  { id: "s12", v: ["b1", "b2", "t2", "t1"], shade: 0.75 },
  { id: "s23", v: ["b2", "b3", "t3", "t2"], shade: 0.88 },
  { id: "s30", v: ["b3", "b0", "t0", "t3"], shade: 0.75 }
];
function boxGeo(bx, g) {
  const B = bottomQuad(bx, g), T = topQuad(B, bx, g);
  const pt = s => (s[0] === "b" ? B : T)[+s[1]];
  const s1 = Math.sign(dot(sub(B[1], B[0]), sub(g.vp[0], B[0]))) || 1;
  const s3 = Math.sign(dot(sub(B[3], B[0]), sub(g.vp[1], B[0]))) || 1;
  const s0 = Math.sign(dot(sub(g.vp[1], g.vp[0]), g.u)) || 1;
  const H = s1 * s3 * s0;
  const faces = FACES.map(f => { const pts = f.v.map(pt); return { id: f.id, shade: f.shade, pts, front: polyArea(pts) * H > 0 }; });
  return { B, T, faces };
}
function faceLabel(id) {
  const bx = state.boxes[state.sel];
  if (id === "top") return "Top";
  if (id === "bottom") return "Bottom";
  if (!bx) return id;
  const G = boxGeo(bx, geo());
  const f = G.faces.find(x => x.id === id);
  const vp = (id === "s01" || id === "s23") ? "VP1" : "VP2";
  return `${f.front ? "Near" : "Far"} side, receding to ${vp}`;
}

/* ---------- snapping ---------- */
let snapCache = { key: "", lines: [], pts: [] };
function snapData() {
  const key = JSON.stringify([state.horizon, state.vps, state.verticals]);
  if (key === snapCache.key) return snapCache;
  const g = geo(), lines = [];
  state.vps.forEach((v, vi) => { if (v.rays.show) rayList(vi, g).forEach(r => { if (r.ch !== ".") lines.push({ p: g.vp[vi], d: r.d, fwd: !v.rays.behind, fam: "r" + vi }); }); });
  if (state.horizon.show) lines.push({ p: g.O, d: g.u, fwd: false, fam: "h" });
  const V = state.verticals;
  if (V.show) for (let j = -V.count; j <= V.count; j++) lines.push({ p: add(g.O, mul(g.u, V.offset + j * V.spacing)), d: g.n, fwd: false, fam: "v" });
  const pts = [], LIM = 4e4;
  for (let i = 0; i < lines.length; i++) for (let j = i + 1; j < lines.length; j++) {
    const A = lines[i], Bl = lines[j];
    if (A.fam === Bl.fam) continue;

const HINTS = {

canvas.addEventListener("pointermove", e => {

/* ---------- toolbar ---------- */
document.getElementById("tbAdd").addEventListener("click", addBox);
